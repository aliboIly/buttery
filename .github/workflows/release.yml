name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The notes come from main's What's new, which every release's notes live in, whatever commit the tag is on.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish the release with its notes from What's new
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: https://aliboily.github.io/buttery
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          title="$(node scripts/release-notes.mjs "$version" --title)"
          latest="$(node scripts/release-notes.mjs "$version" --newest)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file notes.md --latest="$latest"
